name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      # Migration 4f9d3c2b1a8e creates the `vector` extension with an HNSW
      # index, which a stock postgres image cannot satisfy.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digital_twin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_twin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/digital_twin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # docker-compose / Dockerfile run python:3.12; pyproject requires >=3.12.
          python-version: "3.12"

      - name: Install backend with dev extra and pinned toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # Pin the exact tool versions used by the dev environment so lint and
          # format verdicts in CI always match local results.
          python -m pip install "pytest==9.1.1" "pytest-asyncio==1.4.0" "httpx==0.28.1" "ruff==0.16.8"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify pgvector schema is serviceable
        run: python -m scripts.verify_pgvector

      - name: Backend test suite (hermetic, no env overrides)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/digital_twin_test
        run: pytest -q

  frontend:
    name: Frontend (typecheck, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          # Matches the versions used by the current frontend toolchain
          # (@types/node ^24, package-lock.json generated on Node 24).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test