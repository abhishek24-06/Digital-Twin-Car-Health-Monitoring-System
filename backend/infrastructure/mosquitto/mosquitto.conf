# Digital Twin MQTT broker configuration (Docker Compose).
#
# Development-only credentials: the password file is generated at container
# start by the `mosquitto` service using mosquitto_passwd from the
# MQTT_USERNAME / MQTT_PASSWORD environment variables (defaults: mqtt/mqtt).
# Do not reuse these credentials outside development.

listener 1883

# Only the configured user may connect. The password file is created by the
# container entrypoint and is never committed.
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd

# Enable persistence so offline QoS 1 messages survive broker restarts.
persistence true
persistence_location /mosquitto/data/

# Since only a fixed dev user publishes, start with a permissive ACL; tighten
# per-vehicle ACLs in a later phase.
acl_file /mosquitto/config/mosquitto.acl

log_type error
log_type warning
log_type notice
log_type information
log_dest stdout