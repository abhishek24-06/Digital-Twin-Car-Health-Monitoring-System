# Digital Twin MQTT broker configuration (local development without Docker).
#
# Binds to loopback only and allows anonymous access so local testing and the
# `make mqtt-test` end-to-end suite need no credentials. The comprehensive
# docker-compose broker (mosquitto.conf) is the credentialed reference setup.
#
# Start with:  mosquitto -c infrastructure/mosquitto/mosquitto.local.conf

listener 1883 127.0.0.1

allow_anonymous true

persistence true
persistence_location ./infrastructure/mosquitto/persist/

log_type error
log_type warning
log_type notice
log_type information
log_dest stdout