[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin-api"
version = "0.1.0"
description = "Digital Twin - Car Health Monitoring Platform (backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "aiomqtt>=2.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    # Required at import time: app/models/rag.py builds the rag_chunks
    # embedding column (make_embedding_column(1024)) while the ORM class is
    # being defined, and app/rag/embeddings.py imports numpy at module scope.
    # Without these two, `import app.main` fails before Uvicorn can bind.
    "pgvector>=0.3.6",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]
# Document ingestion, embedding and reranking. All of these are imported
# lazily (first upload / first encode / first rerank), so the application
# starts without them -- but /rag/search and /admin/rag/documents will fail at
# call time. Install with `pip install -e ".[rag]"`.
rag = [
    "docling>=2.0.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "scipy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["app*", "simulator*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -m 'not mqtt_e2e and not mqtt_integration'"
markers = [
    "mqtt_e2e: requires a running MQTT broker (runs with `make mqtt-test`)",
    "mqtt_integration: real isolated broker + disposable database (runs with `make mqtt-integration`)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "YTT"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
